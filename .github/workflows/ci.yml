name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-contract:
    name: Phase 1 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build ProgressTrace.slnx --configuration Release --nologo --warnaserror

      - name: Run conformance tests
        run: dotnet run --no-build --project tests/ProgressTrace.ConformanceTests/ProgressTrace.ConformanceTests.csproj --configuration Release

      - name: Validate minimal trace with CLI
        run: dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- validate fixtures/valid/minimal-trace.json

      - name: Validate trace envelope schema JSON
        run: python3 -m json.tool contracts/trace-envelope.schema.json > /dev/null

      - name: Evaluate obligation fixtures
        run: |
          dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- evaluate fixtures/valid/multi-event-trace.json fixtures/obligations/valid/partial-progress-ledger.json
          dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- evaluate fixtures/valid/multi-event-trace.json fixtures/obligations/valid/insufficient-evidence-ledger.json

      - name: Validate Phase 1 schema JSON
        run: |
          python3 -m json.tool contracts/obligation-ledger.schema.json > /dev/null
          python3 -m json.tool contracts/evaluation-result.schema.json > /dev/null

      - name: Verify formatting
        run: dotnet format ProgressTrace.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Assess termination fixtures
        run: |
          dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- assess fixtures/valid/multi-event-trace.json fixtures/termination/ledgers/valid/on-target-ledger.json fixtures/termination/valid/on-target-declaration.json
          dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- assess fixtures/termination/traces/valid/non-contiguous-sequence-trace.json fixtures/termination/ledgers/valid/all-stable-rollup-ledger.json fixtures/termination/valid/all-stable-rollup-declaration.json

      - name: Validate Phase 2a schema JSON
        run: |
          python3 -m json.tool contracts/termination-declaration.schema.json > /dev/null
          python3 -m json.tool contracts/stop-assessment-result.schema.json > /dev/null

      - name: Compare baseline fixtures
        run: |
          dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- compare fixtures/valid/multi-event-trace.json fixtures/termination/ledgers/valid/mixed-rollup-ledger.json fixtures/termination/valid/mixed-rollup-declaration.json fixtures/baseline/definitions/valid/unused-budget-baseline.json
          dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- compare fixtures/valid/multi-event-trace.json fixtures/termination/ledgers/valid/mixed-rollup-ledger.json fixtures/termination/valid/mixed-rollup-declaration.json fixtures/baseline/definitions/valid/budget-exhausted-baseline.json
          dotnet run --no-build --project src/ProgressTrace.Cli/ProgressTrace.Cli.csproj --configuration Release -- compare fixtures/termination/traces/valid/non-contiguous-sequence-trace.json fixtures/termination/ledgers/valid/dual-unmet-ledger.json fixtures/termination/valid/dual-unmet-declaration.json fixtures/baseline/definitions/valid/dual-unused-budget-baseline.json

      - name: Validate Phase 2b schema JSON
        run: |
          python3 -m json.tool contracts/baseline-definition.schema.json > /dev/null
          python3 -m json.tool contracts/baseline-comparison-result.schema.json > /dev/null
